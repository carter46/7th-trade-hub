<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>You're offline</title>
    <style>
        :root {
            color-scheme: light;
            --brand: #0B6A39;
            --brand-soft: rgba(11, 106, 57, 0.12);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #fff;
            color: #1a1a1a;
        }

        .card {
            width: min(100%, 28rem);
            text-align: center;
            padding: 2rem 1.5rem;
            border: 1px solid rgba(11, 106, 57, 0.15);
            border-radius: 1rem;
            background: linear-gradient(180deg, var(--brand-soft) 0%, #fff 40%);
        }

        .spinner {
            width: 3.5rem;
            height: 3.5rem;
            margin: 0 auto 1.25rem;
            border: 3px solid rgba(11, 106, 57, 0.15);
            border-top-color: var(--brand);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        h1 {
            margin: 0 0 0.5rem;
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--brand);
        }

        p {
            margin: 0;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #555;
        }

        .status {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #777;
        }

        button {
            margin-top: 1.25rem;
            appearance: none;
            border: 0;
            border-radius: 0.65rem;
            padding: 0.75rem 1.25rem;
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
            background: var(--brand);
            cursor: pointer;
        }

        button:hover { background: #095a30; }
        button:disabled { opacity: 0.65; cursor: wait; }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (prefers-reduced-motion: reduce) {
            .spinner { animation: none; border-top-color: rgba(11, 106, 57, 0.35); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner" aria-hidden="true"></div>
        <h1 id="title">You're offline</h1>
        <p id="message">We couldn't reach the server. We'll reload this page automatically when your connection is back.</p>
        <p class="status" id="status" aria-live="polite">Checking connection…</p>
        <button type="button" id="retry">Try again</button>
    </div>

    <script>
        (function () {
            var titleEl = document.getElementById('title');
            var messageEl = document.getElementById('message');
            var statusEl = document.getElementById('status');
            var retryBtn = document.getElementById('retry');
            var checking = false;
            var reloadScheduled = false;

            function setStatus(text) {
                if (statusEl) {
                    statusEl.textContent = text;
                }
            }

            function scheduleReload() {
                if (reloadScheduled) {
                    return;
                }
                reloadScheduled = true;
                setStatus('Connection restored. Reloading…');
                if (titleEl) {
                    titleEl.textContent = 'Back online';
                }
                window.setTimeout(function () {
                    window.location.reload();
                }, 400);
            }

            function probe() {
                if (checking || reloadScheduled) {
                    return Promise.resolve(false);
                }

                checking = true;
                if (retryBtn) {
                    retryBtn.disabled = true;
                }

                var target = window.location.pathname + window.location.search;
                if (!target || target === '/offline.html') {
                    target = '/';
                }

                return fetch(target, {
                    method: 'GET',
                    cache: 'no-store',
                    credentials: 'same-origin',
                    headers: { 'X-Offline-Probe': '1' },
                })
                    .then(function (response) {
                        if (response && response.ok) {
                            scheduleReload();
                            return true;
                        }
                        setStatus('Still offline. Retrying…');
                        return false;
                    })
                    .catch(function () {
                        setStatus('Still offline. Retrying…');
                        return false;
                    })
                    .finally(function () {
                        checking = false;
                        if (retryBtn && !reloadScheduled) {
                            retryBtn.disabled = false;
                        }
                    });
            }

            function onOnline() {
                if (titleEl) {
                    titleEl.textContent = 'Reconnecting…';
                }
                if (messageEl) {
                    messageEl.textContent = 'Your device is back online. Loading the site…';
                }
                probe();
            }

            window.addEventListener('online', onOnline);

            if (retryBtn) {
                retryBtn.addEventListener('click', function () {
                    setStatus('Checking connection…');
                    probe();
                });
            }

            if (navigator.onLine) {
                probe();
            } else {
                setStatus('Waiting for internet…');
            }

            window.setInterval(function () {
                if (!reloadScheduled) {
                    probe();
                }
            }, 5000);
        })();
    </script>
</body>
</html>
