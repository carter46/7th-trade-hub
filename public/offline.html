<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>You're offline</title>
    <style>
        :root {
            color-scheme: light;
            --brand: #0B6A39;
            --brand-soft: rgba(11, 106, 57, 0.12);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #fff;
            color: #1a1a1a;
        }

        .card {
            width: min(100%, 28rem);
            text-align: center;
            padding: 2rem 1.5rem;
            border: 1px solid rgba(11, 106, 57, 0.15);
            border-radius: 1rem;
            background: linear-gradient(180deg, var(--brand-soft) 0%, #fff 40%);
        }

        h1 {
            margin: 0 0 0.5rem;
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--brand);
        }

        p {
            margin: 0;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #555;
        }

        .actions {
            margin-top: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            align-items: center;
        }

        button, .link-btn {
            appearance: none;
            border: 0;
            border-radius: 0.65rem;
            padding: 0.75rem 1.25rem;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            cursor: pointer;
        }

        button {
            color: #fff;
            background: var(--brand);
        }

        button:hover { background: #095a30; }

        .link-btn {
            color: var(--brand);
            background: transparent;
            border: 1px solid rgba(11, 106, 57, 0.25);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>You're offline</h1>
        <p>We couldn't reach the server. Check your connection, then try again.</p>
        <div class="actions">
            <button type="button" id="retry">Try again</button>
            <a class="link-btn" href="/">Go to homepage</a>
            <a class="link-btn" href="/dashboard">Go to dashboard</a>
        </div>
    </div>

    <script>
        document.getElementById('retry')?.addEventListener('click', function () {
            window.location.reload();
        });
    </script>
</body>
</html>
