<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>You're offline</title>
    <style>
        :root {
            color-scheme: light;
            --brand: #0B6A39;
            --brand-soft: rgba(11, 106, 57, 0.12);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #fff;
            color: #1a1a1a;
        }

        .card {
            width: min(100%, 28rem);
            text-align: center;
            padding: 2rem 1.5rem;
            border: 1px solid rgba(11, 106, 57, 0.15);
            border-radius: 1rem;
            background: linear-gradient(180deg, var(--brand-soft) 0%, #fff 40%);
        }

        .spinner {
            width: 3.5rem;
            height: 3.5rem;
            margin: 0 auto 1.25rem;
            border: 3px solid rgba(11, 106, 57, 0.15);
            border-top-color: var(--brand);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        h1 {
            margin: 0 0 0.5rem;
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--brand);
        }

        p {
            margin: 0;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #555;
        }

        .status {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #777;
        }

        .actions {
            margin-top: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            align-items: center;
        }

        button, .link-btn {
            appearance: none;
            border: 0;
            border-radius: 0.65rem;
            padding: 0.75rem 1.25rem;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
        }

        button {
            color: #fff;
            background: var(--brand);
            cursor: pointer;
        }

        button:hover { background: #095a30; }
        button:disabled { opacity: 0.65; cursor: wait; }

        .link-btn {
            color: var(--brand);
            background: transparent;
            border: 1px solid rgba(11, 106, 57, 0.25);
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (prefers-reduced-motion: reduce) {
            .spinner { animation: none; border-top-color: rgba(11, 106, 57, 0.35); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner" aria-hidden="true"></div>
        <h1 id="title">You're offline</h1>
        <p id="message">We couldn't reach the server. We'll try again automatically when your connection is back.</p>
        <p class="status" id="status" aria-live="polite">Checking connection…</p>
        <div class="actions">
            <button type="button" id="retry">Try again</button>
            <a class="link-btn" id="home-link" href="/dashboard">Go to dashboard</a>
        </div>
    </div>

    <script>
        (function () {
            var titleEl = document.getElementById('title');
            var messageEl = document.getElementById('message');
            var statusEl = document.getElementById('status');
            var retryBtn = document.getElementById('retry');
            var homeLink = document.getElementById('home-link');
            var checking = false;
            var reloadScheduled = false;
            var maxAutoReloads = 2;
            var reloadKey = 'offline-reload:' + window.location.pathname + window.location.search;

            function isPaymentCallback() {
                var path = window.location.pathname || '';
                var search = window.location.search || '';

                return path.indexOf('/callback') !== -1
                    || search.indexOf('paymentReference=') !== -1
                    || search.indexOf('payment_reference=') !== -1;
            }

            function reloadCount() {
                try {
                    return Number(sessionStorage.getItem(reloadKey) || '0');
                } catch {
                    return 0;
                }
            }

            function incrementReloadCount() {
                try {
                    sessionStorage.setItem(reloadKey, String(reloadCount() + 1));
                } catch {
                    // ignore
                }
            }

            function probeTarget() {
                if (isPaymentCallback()) {
                    return '/dashboard';
                }

                var target = window.location.pathname + window.location.search;
                if (!target || target === '/offline.html') {
                    return '/';
                }

                return target;
            }

            function resumeTarget() {
                if (isPaymentCallback()) {
                    return window.location.pathname + window.location.search;
                }

                return window.location.pathname + window.location.search;
            }

            function setStatus(text) {
                if (statusEl) {
                    statusEl.textContent = text;
                }
            }

            function scheduleReload() {
                if (reloadScheduled) {
                    return;
                }

                if (reloadCount() >= maxAutoReloads) {
                    setStatus('Connection looks OK. Use Try again or open the dashboard.');
                    if (messageEl) {
                        messageEl.textContent = 'Automatic reload stopped to avoid a loop. Your payment may already be complete.';
                    }
                    if (homeLink && isPaymentCallback()) {
                        homeLink.textContent = 'Go to wallet / deposits';
                        homeLink.href = '/dashboard/deposit';
                    }
                    return;
                }

                reloadScheduled = true;
                incrementReloadCount();
                setStatus('Connection restored. Reloading…');
                if (titleEl) {
                    titleEl.textContent = 'Back online';
                }

                window.setTimeout(function () {
                    window.location.replace(resumeTarget());
                }, 400);
            }

            function probe() {
                if (checking || reloadScheduled) {
                    return Promise.resolve(false);
                }

                checking = true;
                if (retryBtn) {
                    retryBtn.disabled = true;
                }

                return fetch(probeTarget(), {
                    method: 'GET',
                    cache: 'no-store',
                    credentials: 'same-origin',
                    headers: { 'X-Offline-Probe': '1' },
                })
                    .then(function (response) {
                        if (response && response.ok) {
                            scheduleReload();
                            return true;
                        }

                        setStatus('Still offline. Retrying…');
                        return false;
                    })
                    .catch(function () {
                        setStatus('Still offline. Retrying…');
                        return false;
                    })
                    .finally(function () {
                        checking = false;
                        if (retryBtn && !reloadScheduled) {
                            retryBtn.disabled = false;
                        }
                    });
            }

            function onOnline() {
                if (titleEl) {
                    titleEl.textContent = 'Reconnecting…';
                }
                if (messageEl) {
                    messageEl.textContent = 'Your device is back online. Loading the site…';
                }
                probe();
            }

            window.addEventListener('online', onOnline);

            if (retryBtn) {
                retryBtn.addEventListener('click', function () {
                    if (isPaymentCallback()) {
                        setStatus('Retrying payment return…');
                        window.location.replace(resumeTarget());
                        return;
                    }

                    setStatus('Checking connection…');
                    probe();
                });
            }

            if (isPaymentCallback()) {
                if (messageEl) {
                    messageEl.textContent = 'We could not finish confirming your payment. If you completed checkout, open deposits or try again.';
                }
                if (homeLink) {
                    homeLink.textContent = 'Go to wallet / deposits';
                    homeLink.href = '/dashboard/deposit';
                }
            }

            if (navigator.onLine) {
                probe();
            } else {
                setStatus('Waiting for internet…');
            }

            window.setInterval(function () {
                if (!reloadScheduled && reloadCount() < maxAutoReloads) {
                    probe();
                }
            }, 8000);
        })();
    </script>
</body>
</html>
